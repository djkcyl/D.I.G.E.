services:
  dige:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dige-calculator
    restart: unless-stopped
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      retries: 3
